name: Release
on:
  push:
    branches: [ master, staging, next ]

jobs:
  semantic-release:
    name: Bump version and release
    if: github.repository_owner == 'ZPTXDev'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          token: ${{ secrets.PUSH_TO_PROTECTED_BRANCH }}
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
      - name: Install dependencies
        run: bun install
      - name: Build
        run: bun run build
      - name: Package release bundle
        run: |
          mkdir -p release
          cp -r dist release/
          cp package.json release/
          cp bun.lock release/ || true
          cp pnpm-lock.yaml release/ || true
          cp README.md release/ || true
          cp LICENSE release/ || true
          zip -r quaver-release.zip release/
      - name: Release
        uses: cycjimmy/semantic-release-action@v6
        with:
          branches: |
            [
              'master',
              { name: 'staging', prerelease: true },
              { name: 'next', prerelease: true }
            ]
          extra_plugins: |
            @semantic-release/git
        env:
          GITHUB_TOKEN: ${{ secrets.PUSH_TO_PROTECTED_BRANCH }}
