version: 2

multi-ecosystem-groups:
  core:
    schedule:
      interval: daily
      time: "21:00"

updates:
- package-ecosystem: npm
  directory: "/"
  patterns: ["*"]
  schedule:
    interval: daily
    time: "21:00"
  open-pull-requests-limit: 10
  target-branch: next
  versioning-strategy: increase
  labels:
  - "affects:dependencies"
  - "priority:p2"
  - "status:tested"
  - "status:confirmed"
  - "type:enhancement"
  multi-ecosystem-group: "core"
- package-ecosystem: bun
  directory: "/"
  patterns: ["*"]
  schedule:
    interval: daily
    time: "21:00"
  open-pull-requests-limit: 10
  target-branch: next
  versioning-strategy: increase
  labels:
    - "affects:dependencies"
    - "priority:p2"
    - "status:tested"
    - "status:confirmed"
    - "type:enhancement"
  multi-ecosystem-group: "core"
- package-ecosystem: github-actions
  directory: "/"
  schedule:
    interval: daily
    time: "21:00"
  open-pull-requests-limit: 10
  target-branch: next
  labels:
  - "affects:dependencies"
  - "priority:p2"
  - "status:tested"
  - "status:confirmed"
  - "type:enhancement"
